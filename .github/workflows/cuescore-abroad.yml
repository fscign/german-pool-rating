# CueScore events in Austria, Switzerland, Italy and France (added 6 Nov 2026). The German rating counts only the matches
# with a German player in these events. Each country is a separate step: if one fails, the others are still saved.
name: Collect CueScore abroad (AT, CH, IT, FR)
on:
  schedule:
    - cron: '41 0 * * *'   # 00:41 UTC daily (the first run reads everything since 2016 and takes longer)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-cuescore-abroad
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy requests beautifulsoup4 lxml
      - name: Collect each country (tournaments + team events)
        shell: bash
        run: |
          mkdir -p data/status
          for c in "Austria at" "Switzerland ch" "Italy it" "France fr"; do
            set -- $c; name=$1; code=$2
            for job in "collect_cuescore.py" "collect_team.py"; do
              export CS_COUNTRY="$name" CS_FILE="data/${code}_cuescore_raw.json.gz" CS_TEAM_FILE="data/${code}_team_raw.json"
              if python3 -I $job > log.txt 2>&1; then res=OK; else res=FAILED; fi
              { echo "### $name $job ($res)"; echo '```'; tail -15 log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              echo "$(date -u +'%Y-%m-%d %H:%M') UTC | $res | $(grep -v '^\s*$' log.txt | tail -1 | cut -c1-200)" > "data/status/${code}_${job}.txt"
            done
          done
      - name: Save the collected data
        if: always()
        run: |
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add data/at_* data/ch_* data/it_* data/fr_* data/status || true
          git commit -m "Collect CueScore abroad $(date +%Y-%m-%d)" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && exit 0; sleep 15; done
          exit 1
