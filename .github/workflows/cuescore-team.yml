name: Collect CueScore team events
on:
  schedule:
    - cron: '19 1 * * *'   # 01:19 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-cuescore-team
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      script: collect_team.py
      files: data/team_raw.json
      timeout: 120
