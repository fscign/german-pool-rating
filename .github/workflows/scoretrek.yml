name: Collect Score Trek
on:
  schedule:
    - cron: '11 2 * * *'   # 02:11 UTC daily (first run reads everything, about 40 min)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-scoretrek
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      script: collect_scoretrek.py
      files: data/scoretrek_raw.json.gz
      timeout: 120
