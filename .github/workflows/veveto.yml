name: Collect VeVeTo Hessen
on:
  schedule:
    - cron: '57 1 * * *'   # 01:57 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-veveto
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      script: collect_veveto.py
      files: data/hessen_veveto.json.gz
      timeout: 90
