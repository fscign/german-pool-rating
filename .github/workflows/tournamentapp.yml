name: Collect TournamentApp
on:
  schedule:
    - cron: '31 1 * * *'   # 01:31 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-tournamentapp
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      script: collect_tournamentapp.py
      files: data/ta_raw.json
      timeout: 90
