name: Daily rating update
on:
  schedule:
    - cron: '47 2 * * *'   # every day 02:47 UTC, after the collection in fscign/pool-data (00:07 and 01:07) and before the Latvian update at 03:23; off the full hour, when GitHub is busiest
  workflow_dispatch:       # "Run workflow" button for manual updates
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy requests beautifulsoup4 lxml
      - name: Get the raw data from fscign/pool-data (all sources are collected there)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh get_data.sh
      - name: Build the rating from the collected data 
        run: sh run_update.sh --no-collect
      - name: Save new results
        run: |
          cat report.txt >> "$GITHUB_STEP_SUMMARY" || true
          # Data sources: when each collector last ran and whether it worked (a source not collected today keeps older data)
          today=$(date -u +%Y-%m-%d)
          {
            echo; echo "### Data sources"; echo; echo "| Source | Last collected | Result | Last log line |"; echo "|---|---|---|---|"
            for f in status/status_*.txt; do
              [ -f "$f" ] || continue
              n=$(basename "$f" .txt); n=${n#status_}; IFS='|' read -r when res last < "$f"
              case "$when" in "$today"*) flag="";; *) flag=" ⚠ not today";; esac
              echo "| $n | $when$flag | $res | $last |"
            done
          } >> "$GITHUB_STEP_SUMMARY" || true
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add site data/site_ids.json data/fargo_fixed.json data/fargo_ref.json data/fargo_foreign.json
          git commit -m "Daily update $(date +%Y-%m-%d)" || echo "No changes"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 10; done
          exit 1
