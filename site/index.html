<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ratings of German pool players in 8-ball, 9-ball, 10-ball and Multiball, calculated from tournament and league results. Updated daily.">
<meta name="theme-color" content="#0d1712">
<title>German Pool Rating</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d1712'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23f2c230'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%230d1712'%3E9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#0d1712;--p1:#13211a;--p2:#182a20;--p3:#1f3529;--ln:#25402f;--fg:#e8eee9;--mu:#8fa597;--gold:#f2c230;--gold2:#c99b12;--up:#6fd08f;--dn:#f08a77;--felt:#1f6b45;--sil:#c5cec8;--brz:#d08a52;--hd:"Oswald","Arial Narrow",sans-serif;--tx:"Roboto",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--tx);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.in{max-width:1180px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
.bar{position:sticky;top:0;z-index:20;background:#09110d;border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top)}
.bar .in{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:500 21px/1 var(--hd);letter-spacing:.04em;white-space:nowrap}
.logo b{color:var(--gold);font-weight:500}
.logo .ico{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#09110d;display:grid;place-items:center;font:600 15px/1 var(--hd)}
#nav{display:flex;height:100%}
#nav a{display:flex;align-items:center;padding:0 11px;text-decoration:none;font:400 16px/1 var(--hd);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-3px}
#nav a:hover{color:var(--fg)}
#nav a.on{color:var(--fg);border-bottom-color:var(--fg)}
.find{position:relative;margin-left:auto}
.find input{width:200px;height:36px;border-radius:3px;border:1px solid var(--ln);background:var(--p1);padding:0 12px 0 34px}
.find svg{position:absolute;left:11px;top:11px;width:14px;height:14px;stroke:var(--mu)}
.find input:focus{outline:none;border-color:var(--gold)}
.drop{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:240px;background:var(--p2);border:1px solid var(--ln);border-radius:3px;list-style:none;margin:0;padding:4px 0;max-height:320px;overflow:auto;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.drop li{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
.drop li.on,.drop li:hover{background:var(--p3)}
.drop li span{color:var(--gold);font-family:var(--hd)}
.drop li.none{color:var(--mu);cursor:default}
main{padding:30px 0 60px;min-height:70vh}
h1,h2,h3{font-family:var(--hd);font-weight:500;margin:0;letter-spacing:.02em}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mu);margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 22px}
.pc{display:flex;align-items:center;gap:16px;background:var(--p1);border-top:4px solid var(--c);padding:16px 18px;text-decoration:none}
.pc:hover{background:var(--p2)}
.pc .rk{font:600 40px/1 var(--hd);color:var(--c);width:34px}
.pc .nm{font-weight:700;font-size:17px;line-height:1.2}
.pc .mt{color:var(--mu);font-size:13px}
.pc .rt{margin-left:auto;font:500 38px/1 var(--hd);color:var(--gold)}
.fbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--p1);padding:12px 16px;margin-bottom:2px}
.fl{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--mu);font-size:14px;border-right:1px solid var(--ln)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--gold);color:#0d1712;font-weight:500}
select,input[type=date],input.txt{height:34px;border-radius:3px;border:1px solid var(--ln);background:var(--p2);padding:0 10px}
select:focus,input:focus{outline:none;border-color:var(--gold)}
input.txt{width:230px}
table{width:100%;border-collapse:collapse}
.tb{background:var(--p1);overflow-x:auto}
th{font:400 13px/1 var(--hd);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);text-align:left;padding:12px 12px;background:#0f1b15;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--fg)}th.cur{color:var(--gold)}
td{padding:9px 12px;border-top:1px solid #1b2e23;white-space:nowrap}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
tbody tr:hover td{background:var(--p2)}
.r{text-align:right}
.rkb{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:2px;background:var(--p3);font:500 15px/1.3 var(--hd)}
.rkb.g1{background:var(--gold);color:#0d1712}.rkb.g2{background:var(--sil);color:#0d1712}.rkb.g3{background:var(--brz);color:#0d1712}
.rating{font:500 21px/1 var(--hd);color:var(--gold)}
.pv{opacity:.55}
.ptag{font:500 10px/1 var(--tx);color:var(--mu);border:1px solid var(--ln);border-radius:2px;padding:2px 4px;margin-left:6px;vertical-align:3px}
.pl{text-decoration:none;font-weight:500}
.pl:hover{color:var(--gold)}
.ctry{font-size:11px;color:var(--mu);margin-left:7px;letter-spacing:.04em}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.btnrow{display:flex;justify-content:center;margin:16px 0}
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:9px 22px;border-radius:3px;cursor:pointer;font:400 15px/1 var(--hd);letter-spacing:.06em;text-transform:uppercase}
.btn:hover{background:var(--gold);color:#0d1712}
.fine{color:var(--mu);font-size:13px;margin:12px 0 0}
.wl{display:inline-block;min-width:46px;text-align:center;border-radius:2px;padding:1px 6px;font-weight:700}
.wl.w{background:rgba(111,208,143,.15);color:var(--up)}.wl.l{background:rgba(240,138,119,.13);color:var(--dn)}
.bl{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;font:700 8px/18px var(--tx);text-align:center;color:#111}
.b8{background:radial-gradient(circle,#fff 0 37%,#111 39%)}
.b9{background:radial-gradient(circle,#fff 0 37%,transparent 39%),linear-gradient(#eee 0 24%,#e6b41c 24% 76%,#eee 76%)}
.b10{background:radial-gradient(circle,#fff 0 37%,transparent 39%),linear-gradient(#eee 0 24%,#2b63c6 24% 76%,#eee 76%);font-size:7px}
.bm{background:conic-gradient(#e6b41c 0 25%,#2b63c6 0 50%,#c8352b 0 75%,#6c3fa8 0)}
.gn{margin-left:7px;color:var(--mu);font-size:13px}
.hero{background:linear-gradient(90deg,var(--p2),var(--p1));border-left:6px solid var(--gold);padding:24px 26px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.hero .who{flex:1;min-width:240px}
.hero .who .rkline{font:400 15px/1 var(--hd);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.hero .meta{color:var(--mu);margin-top:8px;display:flex;gap:6px 18px;flex-wrap:wrap}
.hero .meta a{color:var(--fg)}
.big{text-align:right}
.big .v{font:500 68px/.95 var(--hd);color:var(--gold)}
.big .k{color:var(--mu);font-size:13px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.box{background:var(--p1);padding:18px 20px}
.box h2{margin-bottom:12px}
.box+.box{margin-top:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #1b2e23}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--mu)}
.kv .v{font:500 18px/1.2 var(--hd);text-align:right}
.kv .s{display:block;font:400 12px/1.3 var(--tx);color:var(--mu)}
.opp{padding:10px 0;border-top:1px solid #1b2e23}
.opp .k{color:var(--mu);font-size:13px}
.opp .n{font-weight:700;font-size:16px;margin:2px 0}
.opp .s{font-size:13px;color:var(--mu)}
.fgrid{display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 0 12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.combo{position:relative}
.combo input{width:220px}
.sumline{color:var(--mu);margin:0 0 10px;font-size:14px}
.sumline b{color:var(--fg);font-weight:500}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;background:var(--p2);border:1px solid var(--ln);padding:14px 18px;margin-bottom:12px}
.vs .side{display:flex;flex-direction:column}
.vs .side.rt{text-align:right}
.vs .side b{font-size:16px}
.vs .side span{font:500 26px/1.1 var(--hd);color:var(--gold)}
.vs .mid{text-align:center}
.vs .mid .sc{font:500 34px/1 var(--hd)}
.vs .mid .s{color:var(--mu);font-size:13px}
.chart svg{display:block;width:100%;height:auto}
.ldr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.lb{background:var(--p1)}
.lb .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:2px solid var(--felt)}
.lb .hd h2{font-size:19px}
.lb .seg button{padding:4px 9px;font-size:13px}
.lb table td{padding:8px 16px}
.lb .fine{padding:0 16px 14px}
.thead{background:var(--p1);padding:16px 18px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.thead .it{display:flex;flex-direction:column}
.thead .it .k{color:var(--mu);font-size:12px}
.thead .it .v{font:500 18px/1.2 var(--hd)}
.thead a.ext{margin-left:auto;color:var(--gold);text-decoration:none;font:400 15px/1 var(--hd);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--gold);padding:8px 14px;border-radius:3px}
.thead a.ext:hover{background:var(--gold);color:#0d1712}
.text{max-width:760px}
.text h2{margin:30px 0 10px;color:var(--gold)}
.text p,.text li{color:#d4ddd6}
.text li{margin:6px 0}
.cta{display:inline-block;margin-top:6px;background:var(--gold);color:#0d1712;text-decoration:none;font:500 16px/1 var(--hd);letter-spacing:.05em;text-transform:uppercase;padding:13px 22px;border-radius:3px}
.foot{border-top:1px solid var(--ln);background:#09110d;padding:22px 0 calc(26px + env(safe-area-inset-bottom));color:var(--mu);font-size:13px}
.foot .in{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.foot a{color:var(--gold);text-decoration:none}
.empty{padding:30px;text-align:center;color:var(--mu)}
.hpick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:end;background:var(--p1);padding:16px 18px;margin-bottom:20px}
.hpick label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.hpick input{width:100%}
.swap{height:34px;width:42px;border:1px solid var(--ln);background:var(--p2);color:var(--gold);border-radius:3px;cursor:pointer;font-size:18px}
.swap:hover{border-color:var(--gold)}
.hbig{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;background:linear-gradient(90deg,var(--p2),var(--p1),var(--p2));border-top:3px solid var(--gold);padding:22px 24px;margin-bottom:20px}
.hbig .sd{display:flex;flex-direction:column;gap:2px}.hbig .sd.rt{text-align:right}
.hbig .sd b{font-size:18px}.hbig .sd .rv{font:500 40px/1 var(--hd);color:var(--gold)}
.hbig .mid{text-align:center}.hbig .mid .sc{font:500 52px/1 var(--hd)}
.hbig .mid .s{color:var(--mu);font-size:13px;margin-top:4px}
.chbar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:14px 0 6px;background:var(--p3)}
.chbar i{display:block;background:var(--gold)}
.chl{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.vsl{color:var(--gold);text-decoration:none;margin-left:6px;font-size:14px}
.vsl:hover{color:var(--fg)}
.star{background:none;border:0;padding:0 8px 0 0;cursor:pointer;color:#4f6a59;font-size:17px;line-height:1;vertical-align:-1px}
.star:hover{color:var(--gold)}.star.on{color:var(--gold)}
.hero .star{font-size:30px;padding:0 0 0 12px;vertical-align:4px}
tr.pinh td{background:#0f1b15!important;color:var(--gold);font:400 13px/1 var(--hd);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px}
tr.pin td{background:rgba(242,194,48,.06)!important}
tr.pin.last td{border-bottom:2px solid var(--gold2)}
.hint{color:var(--mu);font-size:13px;margin:10px 0 0}
.uw{color:var(--gold);font-family:var(--hd);font-size:17px}
.load{padding:80px 0;text-align:center;font:400 18px/1 var(--hd);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}.lay.pp>aside{order:-1}.ldr{grid-template-columns:1fr}}
@media (max-width:860px){
 .bar .in{height:auto;flex-wrap:wrap;gap:0 12px;padding-top:10px}
 .find{order:2}.find input{width:150px;height:32px}
 #nav{order:3;width:100%;height:42px;overflow-x:auto;scrollbar-width:none}
 #nav a{padding:0 10px;font-size:15px}
 .pod{grid-template-columns:1fr;gap:6px}
 .pc{padding:10px 14px;border-top:0;border-left:4px solid var(--c)}
 .pc .rk{font-size:28px;width:24px}.pc .rt{font-size:30px}
 .hide{display:none}
 .big .v{font-size:52px}
}
@media (max-width:520px){
 .logo{font-size:17px}.logo .ico{width:24px;height:24px;font-size:13px}
 .find input{width:118px}
 td,th{padding:8px 7px}
 .fbar{padding:10px 12px}
 .hero{padding:18px}.big{text-align:left}
 .combo input,input.txt{width:100%}
 .fgrid label{flex:1 1 100%}
 .vs .side span{font-size:20px}.vs .mid .sc{font-size:26px}
 .hpick{grid-template-columns:1fr;}.swap{width:100%}
 .hbig{padding:16px 12px;gap:8px}.hbig .sd b{font-size:15px}.hbig .sd .rv{font-size:28px}.hbig .mid .sc{font-size:36px}
 .hide2{display:none}
 .rkt td:nth-child(2){white-space:normal;line-height:1.25}
 .rkt th:first-child{width:44px}
}
</style>
</head>
<body>
<header class="bar"><div class="in">
 <a class="logo" href="#ranking"><span class="ico">9</span><span>GERMAN <b>POOL</b> RATING</span></a>
 <nav id="nav"><a href="#ranking" data-r="ranking">Ranking</a><a href="#leaders" data-r="leaders">Leaders</a><a href="#h2h" data-r="h2h">H2H</a><a href="#tournaments" data-r="tournaments">Tournaments</a><a href="#info" data-r="info">Info</a><a href="#support" data-r="support">Support</a></nav>
 <div class="find"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg><input id="find" type="search" placeholder="Search player" autocomplete="off" aria-label="Search player"><ul class="drop" id="findl" hidden></ul></div>
</div></header>
<main class="in" id="app"><div class="load">Loading ratings</div></main>
<footer class="foot"><div class="in"><span>German Pool Rating by Aleksandrs Horsuns</span><span>Results from CueScore, TournamentApp, nuLiga, VeVeTo, EPBF, Matchroom and PBS</span><a href="#support">Support the project</a></div></footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let D,PL={},TO={},PM={},GEN='2026-11-01',NOW;
const toD=n=>{const s=String(n);return new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)))};
const ds=n=>{const s=String(n);return +s.slice(6,8)+' '+MON[+s.slice(4,6)-1]+' '+s.slice(0,4)};
const di=s=>+String(s).replace(/-/g,'');
const back=y=>{const d=new Date(NOW);d.setUTCMonth(d.getUTCMonth()-Math.round(y*12));return +d.toISOString().slice(0,10).replace(/-/g,'')};
const fmt=n=>Number(n).toLocaleString('en-GB');
const mem=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('gpr_'+k));localStorage.setItem('gpr_'+k,JSON.stringify(v))}catch(e){return null}};
const nm=id=>PL[id]?PL[id].first+' '+PL[id].last:'Unknown';
const shown=id=>PL[id]&&PL[id].de;
const who=id=>shown(id)?`<a class="pl" href="#p${id}">${esc(nm(id))}</a>`:`<span>${esc(nm(id))}</span>${PL[id]&&PL[id].cc?`<span class="ctry">${esc(PL[id].cc)}</span>`:''}`;
const ball=g=>{const k={'8-ball':'b8','9-ball':'b9','10-ball':'b10'}[g]||'bm';const n={'8-ball':8,'9-ball':9,'10-ball':10}[g]||'';return `<span class="bl ${k}" title="${esc(g)}">${n}</span>`};
const seg=(name,opts,cur)=>`<span class="seg">${opts.map(([v,l])=>`<button data-${name}="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</span>`;
let STARS=new Set((mem('stars')||[]).map(Number));
const star=id=>`<button class="star${STARS.has(id)?' on':''}" data-star="${id}" title="${STARS.has(id)?'Stop following':'Follow this player'}" aria-label="${STARS.has(id)?'Stop following':'Follow this player'}" aria-pressed="${STARS.has(id)}">${STARS.has(id)?'★':'☆'}</button>`;
function bindStars(redraw){$$('[data-star]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const id=+b.dataset.star;STARS.has(id)?STARS.delete(id):STARS.add(id);mem('stars',[...STARS]);redraw()})}
const GN=g=>({'8-ball':'8-ball','9-ball':'9-ball','10-ball':'10-ball','multiball':'Multiball'})[g]||g;
const prov=p=>p.racks<200;
const rateHtml=(p,cls='rating')=>`<span class="${cls}${prov(p)?' pv':''}">${p.r}</span>${prov(p)?'<span class="ptag" title="Provisional: fewer than 200 racks">PROV</span>':''}`;
const sign=d=>d==null?'<span class="mu">-</span>':`<span class="${d>0?'up':d<0?'dn':'mu'}">${d>0?'+':''}${d}</span>`;

Promise.all([fetch('data.json').then(r=>r.json()),fetch('matches.json').then(r=>r.json())]).then(([d,m])=>{
 d.matches=m.matches;D=d;if(d.generated)GEN=d.generated;NOW=toD(di(GEN));
 d.players.forEach(p=>{PL[p[0]]={id:p[0],first:p[1],last:p[2],cc:p[3],r:Math.round(p[5]),rs:p[5],racks:p[6],n:p[7],lp:di(p[8]),ta:p[10],cs:p[11],de:p[12]!==0,sx:p[13]===1?'f':'m'}});
 d.tournaments.forEach(x=>{TO[x[0]]={id:x[0],name:x[1],date:x[2],city:x[3],club:x[4],game:x[5],src:x[6],url:x[7],full:x[8]||'',n:0}});
 d.matches.forEach(m=>{(PM[m[2]]=PM[m[2]]||[]).push(m);(PM[m[3]]=PM[m[3]]||[]).push(m);TO[m[1]].n++});
 setupFind();route();
}).catch(()=>{$('#app').innerHTML='<div class="empty">The rating data could not be loaded. Reload the page to try again.</div>'});
addEventListener('hashchange',()=>{route();scrollTo(0,0)});

function route(){
 let h=location.hash.slice(1)||'ranking';
 const alias={stats:'leaders',form:'leaders',about:'info'};
 if(alias[h]){location.replace('#'+alias[h]);return}

const UPSET_SKIP=new Set([]);
function raceWin(p,n){let s=0,c=1;for(let k=0;k<n;k++){if(k>0)c=c*(n-1+k)/k;s+=c*Math.pow(p,n)*Math.pow(1-p,k)}return s}

function racksBefore(cut){const rk={};for(const m of D.matches){if(m[0]>cut)continue;if(m[0]<=cut-20000)break;rk[m[2]]=(rk[m[2]]||0)+m[4]+m[5];rk[m[3]]=(rk[m[3]]||0)+m[4]+m[5]}return rk}
function upsets(days){
 const cut=cutOf(days),rk=racksBefore(cut),out=[];
 for(const m of D.matches){if(m[0]<=cut)break;
  const[d,tid,a,b,sa,sb]=m;if(sa===sb||Math.max(sa,sb)<4||UPSET_SKIP.has(`${d}:${tid}:${a}:${b}`))continue;
  const[w,l,sw,sl]=sa>sb?[a,b,sa,sb]:[b,a,sb,sa];
  if(!(shown(w)||shown(l)))continue;
  if((rk[w]||0)<200||(rk[l]||0)<200)continue;
  const s=String(d),mi=D.months.indexOf(s.slice(0,4)+'-'+s.slice(4,6))-1;if(mi<0)continue;
  const rw=hIdx(w,mi),rl=hIdx(l,mi);if(rw==null||rl==null)continue;
  const ch=raceWin(1/(1+Math.pow(2,(rl-rw)/100)),sw);if(ch>0.35)continue;
  out.push({d,tid,w,l,sw,sl,rw,rl,ch})}
 return out.sort((x,y)=>x.ch-y.ch);
}
function potm(days){
 const cut=cutOf(days),rk=racksBefore(cut),P={};
 for(const m of D.matches){if(m[0]<=cut)break;
  const[d,tid,a,b,sa,sb]=m,s=String(d),mi=D.months.indexOf(s.slice(0,4)+'-'+s.slice(4,6))-1;if(mi<0)continue;
  [[a,b,sa,sb],[b,a,sb,sa]].forEach(([p,o,w,l])=>{if(!shown(p)||(rk[p]||0)<200)return;const ro=hIdx(o,mi);if(ro==null)return;
   const x=P[p]||(P[p]={id:p,w:0,l:0,g:[]});x.w+=w;x.l+=l;x.g.push([ro,w+l])})}

  const h=hAt(x.id,1);return{...x,perf:Math.round((lo+hi)/2),before:h??PL[x.id].r}}).sort((a,b)=>b.perf-a.perf).slice(0,5);
}

 const x=TO[tid],ms=D.matches.filter(m=>m[1]===tid),ps=new Set();ms.forEach(m=>{ps.add(m[2]);ps.add(m[3])});
 const mi=D.months.indexOf(x.date.slice(0,7))-1,rb=id=>{const v=mi>=0?hIdx(id,mi):null;return v??PL[id].r};
 const P={};ms.forEach(m=>[[m[2],m[3],m[4],m[5]],[m[3],m[2],m[5],m[4]]].forEach(([a,b,w,l])=>{const q=P[a]||(P[a]={id:a,g:[],w:0,l:0,mw:0,mn:0});q.g.push([rb(b),w+l]);q.w+=w;q.l+=l;q.mn++;if(w>l)q.mw++}));
 const perf=Object.values(P).filter(p=>shown(p.id)).map(p=>{let v=null;if(p.w&&p.l){let lo=0,hi=1400;for(let k=0;k<40;k++){const md=(lo+hi)/2,e=p.g.reduce((s,[ro,n])=>s+n/(1+Math.pow(2,(ro-md)/100)),0);if(e<p.w)lo=md;else hi=md}v=Math.round((lo+hi)/2)}return{...p,bf:rb(p.id),v}}).sort((a,b)=>(b.v??-1)-(a.v??-1)||b.w/(b.w+b.l)-a.w/(a.w+a.l));
 const src={cuescore:'CueScore',tournamentapp:'TournamentApp',epbf:'EPBF',wnt:'WNT Live Scores',nuliga:'nuLiga'}[x.src]||x.src;
 $('#app').innerHTML=`<div class="top"><div><h1 style="text-transform:none">${esc(x.name)}</h1></div></div>
 <div class="thead"><div class="it"><span class="k">Date</span><span class="v">${ds(di(x.date))}</span></div><div class="it"><span class="k">Place</span><span class="v">${esc(x.city||'-')}</span></div>
  ${x.club?`<div class="it"><span class="k">Club</span><span class="v">${esc(x.club)}</span></div>`:''}<div class="it"><span class="k">Game</span><span class="v">${ball(x.game)} ${esc(x.game)}</span></div>
  <div class="it"><span class="k">Rated matches</span><span class="v">${ms.length}</span></div><div class="it"><span class="k">Players</span><span class="v">${ps.size}</span></div>
  ${x.url?`<a class="ext" href="${esc(x.url)}" target="_blank" rel="noopener">View on ${esc(src)}</a>`:''}</div>
 <div class="lay"><div class="box"><h2>Matches</h2><div class="tb"><table><thead><tr><th class="hide">Round</th><th class="r">Player</th><th style="text-align:center">Score</th><th>Player</th></tr></thead><tbody>
  ${ms.slice().reverse().map(m=>`<tr><td class="hide mu">${esc(D.stages[m[6]]||'')}</td><td class="r">${who(m[2])} <span class="mu">${PL[m[2]].r}</span></td><td style="text-align:center;font-family:var(--hd);font-size:17px"><span class="${m[4]>m[5]?'up':'mu'}">${m[4]}</span> : <span class="${m[5]>m[4]?'up':'mu'}">${m[5]}</span></td><td><span class="mu">${PL[m[3]].r}</span> ${who(m[3])}</td></tr>`).join('')}
 </tbody></table></div><p class="fine">Walkovers are left out. Foreign players are rated too but are not listed in the ranking.</p></div>
 <aside class="box"><h2>Performance</h2><table><thead><tr><th>Player</th><th class="r">Before</th><th class="r">Perf.</th></tr></thead><tbody>
  ${perf.map(p=>`<tr><td style="white-space:normal">${who(p.id)}<div class="mu" style="font-size:12px">${p.mw}-${p.mn-p.mw} matches, ${p.w}:${p.l} racks</div></td><td class="r mu">${p.bf}</td><td class="r"><span class="rating" style="font-size:18px">${p.v??'-'}</span><div style="font-size:12px">${p.v!=null?sign(p.v-p.bf):''}</div></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No German players.</td></tr>'}
 </tbody></table><p class="fine">Before is the rating at the end of the previous month. Perf. is the rating that best explains the player's racks in this event.</p></aside></div>`;
}

function support(){
 $('#app').innerHTML=`<div class="text"><h1>Support</h1>
 <p class="sub">Keep the rating running</p>
 <p style="margin-top:22px">I build and update this rating in my spare time: collecting results from many sites, joining duplicate player profiles and adding new sources. If you enjoy following it, a coffee helps keep it going. Thank you!</p>
 <p style="margin:26px 0"><a class="cta" href="https://ko-fi.com/ahorsun" target="_blank" rel="noopener">Buy me a coffee on Ko-fi</a></p>
 <p class="fine">Pay by card, Apple Pay, Google Pay or PayPal. No account needed.</p></div>`;
}
function info(){
 const tn=Object.keys(TO).length,yrs=Object.values(TO).map(x=>+x.date.slice(0,4)),np=Object.values(PL).filter(p=>p.de).length;
 $('#app').innerHTML=`<div class="text"><h1>Info</h1>
 <p class="sub">${fmt(tn)} tournaments and league match days, ${fmt(D.matches.length)} matches, ${fmt(np)} German players (${Math.min(...yrs)} to ${Math.max(...yrs)}).</p>
 <h2>The scale</h2>
 <p>Ratings use the FargoRate scale. A player rated 100 points higher is expected to win two racks for every one he loses. At 200 points the ratio is 4 to 1.</p>
 <h2>Which results count</h2>
 <ul><li>Singles in 8-ball, 9-ball, 10-ball and Multiball, played to at least 3 racks.</li>
 <li>Tournaments in Germany on CueScore and TournamentApp, league and championship results from Bavaria (nuLiga) and Hessen (VeVeTo), and all EPBF, Matchroom and Predator Pro Billiard Series events. In events played in sets, every set counts as a separate match.</li>
 <li>Singles from league match days. Doubles are left out.</li>
 <li>Matches against foreign players. They are rated in the background, and players with an established FargoRate keep it as a fixed value.</li></ul>
 <h2>Left out</h2>
 <ul><li>Handicap events, doubles, straight pool, bank pool and one pocket.</li><li>Walkovers and unplayed matches.</li><li>Other events outside Germany.</li></ul>
 <h2>The calculation</h2>
 <p>Every rack counts as a small win or loss. A rating is the number that best explains all of a player's racks against all opponents at once, and everything is recalculated every day. Older results count less: a match loses half its weight every 2 years. A rating based on fewer than 200 racks is provisional (marked PROV).</p>
 <p>When a player has more than one profile, the profiles are joined.</p>
 <h2>Corrections</h2>
 <p>A wrong profile merge or a missing tournament? Write to ahorsun@gmail.com.</p>
 <p class="fine" style="margin-top:28px">Sources: cuescore.com, tournamentapp.de, bbv-billard.liga.nu, hpbv-veveto.de, battle.score-trek.de, epbf.com, wntlivescores.com, probilliardseries.com. Last calculation ${ds(di(GEN))}.</p></div>`;
}
